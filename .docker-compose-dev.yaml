services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db



  postgres:
    image: pgvector/pgvector:0.8.0-pg17-bookworm
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    image: "redis:7-alpine"
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker:
    build: .
    restart: always
    container_name: worker
    environment:
      # macos required
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
    env_file:
      - .env.docker
    depends_on:
      - app
    command: "rq worker --with-scheduler --url redis://${REDIS_HOST}:${REDIS_PORT}/0"


  dashboard:
    build: .
    restart: always
    container_name: dashboard
    ports:
      - "9181:9181"
    env_file:
      - .env.docker
    depends_on:
      - app
    command: "rq-dashboard -u redis://${REDIS_HOST}:${REDIS_PORT}/0"

  app:
    build: .
    restart: always
    container_name: app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - mongodb
      - postgres
      - minio
      - redis


volumes:
  mongodb_data:
  postgres_data:
  minio_data: